<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
لوحة الإدارة العامة
</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="super_admin.css">

</head>

<body>

<div class="container">

<h1>

🕌 لوحة الإدارة العامة

</h1>

<p class="subtitle">

إدارة جميع المساجد من مكان واحد

</p>

<hr>

<button id="addMosque">

➕ إضافة مسجد جديد

</button>
<div id="mosqueModal" class="modal" style="display:none;">

    <div class="modal-box">

        <h2>إضافة مسجد جديد</h2>

        <input
            id="mosqueName"
            type="text"
            placeholder="اسم المسجد">

        <input
            id="mosqueShortName"
            type="text"
            placeholder="الاسم المختصر">

        <input
            id="mosqueLogo"
            type="text"
            placeholder="اسم ملف الشعار">

        <input
            id="mosqueTitle"
            type="text"
            placeholder="اسم ملف العنوان">

        <input
            id="mosqueWhatsapp"
            type="text"
            placeholder="رابط واتساب">

        <button id="saveMosque">

            💾 حفظ

        </button>

        <button id="cancelMosque">

            إلغاء

        </button>

    </div>

</div>
<div id="mosquesContainer">

</div>

</div>
<div id="mosqueModal" class="modal">

<div class="modal-box">

<h2 id="modalTitle">
➕ إضافة مسجد
</h2>

<input
id="mosqueName"
type="text"
placeholder="اسم المسجد">

<input
id="mosqueShortName"
type="text"
placeholder="الاسم المختصر">

<input
id="mosqueLogo"
type="text"
placeholder="رابط اللوجو">

<input
id="mosqueTitle"
type="text"
placeholder="رابط صورة العنوان">

<input
id="mosqueWhatsapp"
type="text"
placeholder="رابط الواتساب">

<input
id="mosqueColor"
type="color"
value="#1976d2">

    <hr>

<h3>إعدادات الكروت</h3>

<label>مجلد الكروت</label>
<input
id="cardsFolder"
placeholder="cards/default/">

<label>قيم الكروت (مفصولة بفاصلة)</label>
<input
id="cardValues"
placeholder="5,10,15,20">

<label>حجم احتفال الكارت الأول</label>
<select id="level1">
    <option value="small">صغير</option>
    <option value="medium">متوسط</option>
    <option value="large">كبير</option>
</select>

<label>حجم احتفال الكارت الثاني</label>
<select id="level2">
    <option value="small">صغير</option>
    <option value="medium">متوسط</option>
    <option value="large">كبير</option>
</select>

<label>حجم احتفال الكارت الثالث</label>
<select id="level3">
    <option value="small">صغير</option>
    <option value="medium">متوسط</option>
    <option value="large">كبير</option>
</select>

<label>حجم احتفال الكارت الرابع</label>
<select id="level4">
    <option value="small">صغير</option>
    <option value="medium">متوسط</option>
    <option value="large">كبير</option>
</select>
<div class="buttons">

<button id="saveMosque">

💾 حفظ

</button>

<button id="cancelMosque">

إلغاء

</button>

</div>

</div>

</div>
<script type="module" src="super_admin.js"></script>

</body>

</html>
