<style>

#introScreen{

position:fixed;
inset:0;
z-index:999999;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
135deg,
#E61C77,
#FF3700,
#FF5500,
#00D0FF
);

font-family:'Cairo',sans-serif;

}


/* المحتوى */

.intro-content{

position:relative;

z-index:5;

text-align:center;

color:white;

}


/* بسم الله */

.bismillah{

font-size:42px;

font-weight:900;

opacity:0;

transform:translateY(-200px) scale(.8);

animation:

bismillahDrop 1.2s cubic-bezier(.2,1.5,.5,1)
.3s forwards;

text-shadow:

0 5px 20px rgba(0,0,0,.25);

}



/* الصلاة */

.salat{

margin-top:25px;

font-size:28px;

font-weight:800;

opacity:0;

animation:

fadeUp 1s ease 1.3s forwards;

}



/* المنافسة */

.competition{

margin-top:25px;

font-size:30px;

font-weight:900;

line-height:1.5;

opacity:0;

animation:

fadeUp 1s ease 1.7s forwards;


}


.competition span{

color:#fff;

text-shadow:

0 0 15px white;

}


/* زر البداية */

#introStart{

margin-top:35px;

padding:12px 40px;

border:none;

border-radius:50px;

font-size:22px;

font-weight:900;

color:#ff5500;

background:white;

box-shadow:

0 0 25px rgba(255,255,255,.8);

opacity:0;

animation:

fadeUp .8s ease 2.2s forwards;

}



/* طبقات الماء */


.water-layer{

position:absolute;

width:160%;

height:160%;

border-radius:45%;

opacity:.25;

filter:blur(20px);

animation:
waveMove 8s linear infinite;

}


.water1{

background:#00D0FF;

top:-70%;

left:-30%;

}


.water2{

background:#E61C77;

bottom:-70%;

right:-30%;

animation-duration:10s;

}


.water3{

background:#FFCC00;

top:20%;

left:-50%;

animation-duration:12s;

}



/* دائرة الدخول */

.intro-circle{

position:absolute;

width:0;

height:0;

background:white;

border-radius:50%;

z-index:10;

}


/* الحركات */


@keyframes bismillahDrop{

to{

opacity:1;

transform:

translateY(0)

scale(1);

}

}


@keyframes fadeUp{

to{

opacity:1;

transform:translateY(0);

}

from{

transform:translateY(40px);

}

}


@keyframes waveMove{


0%{

transform:

rotate(0deg)

translate(0,0);

}


50%{

transform:

rotate(180deg)

translate(40px,-30px);

}


100%{

transform:

rotate(360deg)

translate(0,0);

}


}

/* ==========================
   لمعان النجوم والشرارات
========================== */

.intro-content::before{

content:"";

position:absolute;

width:250px;
height:250px;

left:50%;
top:50%;

transform:translate(-50%,-50%);

background:

radial-gradient(
circle,
rgba(255,255,255,.55),
transparent 70%
);

filter:blur(20px);

animation:

pulseLight 2.5s ease-in-out infinite;

z-index:-1;

}



@keyframes pulseLight{

0%,100%{

opacity:.35;

transform:
translate(-50%,-50%)
scale(.8);

}


50%{

opacity:.8;

transform:
translate(-50%,-50%)
scale(1.25);

}

}


/* ==========================
   نقاط ضوء عائمة
========================== */


#introScreen::before{

content:"✨  ✦  ✧  ✨  ✦  ✧  ✨";

position:absolute;

width:100%;

height:100%;

display:flex;

justify-content:space-around;

align-items:center;

font-size:35px;

color:white;

opacity:.7;

letter-spacing:40px;

animation:

floatingStars 5s ease-in-out infinite;

}



@keyframes floatingStars{


0%{

transform:
translateY(40px);

opacity:.3;

}


50%{

transform:
translateY(-40px);

opacity:1;

}


100%{

transform:
translateY(40px);

opacity:.3;

}

}


/* ==========================
   نبض الكلمات
========================== */


.bismillah,
.salat,
.competition{


animation-fill-mode:forwards;

}


.bismillah{

animation:

bismillahDrop 1.2s cubic-bezier(.2,1.5,.5,1) .3s forwards,

textGlow 2s ease-in-out 1.5s infinite;

}



.salat{

animation:

fadeUp 1s ease 1.3s forwards,

textGlow 2.5s ease-in-out 2.3s infinite;

}


.competition{

animation:

fadeUp 1s ease 1.7s forwards,

textGlow 2.5s ease-in-out 2.7s infinite;

}



@keyframes textGlow{


0%,100%{

text-shadow:

0 0 5px white;

}


50%{

text-shadow:

0 0 30px white,
0 0 50px #00D0FF;

}


}


/* ==========================
   زر البداية بتأثير الماء
========================== */


#introStart{

position:relative;

overflow:hidden;

cursor:pointer;

transition:.3s;

}


#introStart::before{

content:"";

position:absolute;

inset:-50%;

background:

linear-gradient(
120deg,
transparent,
rgba(255,255,255,.8),
transparent
);

transform:translateX(-100%)
rotate(20deg);


animation:

buttonShine 3s infinite;

}



#introStart:hover{

transform:scale(1.08);

}


@keyframes buttonShine{


0%{

transform:
translateX(-120%)
rotate(20deg);

}


40%,100%{

transform:
translateX(120%)
rotate(20deg);

}

}



/* ==========================
   فقاعات الماء
========================== */


#introScreen::after{

content:"";

position:absolute;

inset:0;

background-image:

radial-gradient(
circle,
rgba(255,255,255,.35) 3px,
transparent 4px
);

background-size:

80px 80px;


animation:

bubbles 12s linear infinite;

opacity:.5;

}



@keyframes bubbles{


from{

background-position:

0 100%;

}


to{

background-position:

100px -200px;

}


}


/* ==========================
   انتقال الدائرة السينمائي
========================== */


.intro-circle.open{


animation:

circleOpen .9s cubic-bezier(.7,0,.3,1)
forwards;

}


@keyframes circleOpen{


0%{

width:0;

height:0;

}


100%{


width:300vmax;

height:300vmax;


}

}


/* إخفاء الشاشة */

#introScreen.hide{


opacity:0;

pointer-events:none;

transition:

opacity .5s ease;

}
    /* ==========================
   تحسين الدخول
========================== */


body{

overflow-x:hidden;

}


/* إخفاء الموقع قليلا خلف شاشة البداية */

body.intro-loading .hero,
body.intro-loading .container,
body.intro-loading .reward-btn,
body.intro-loading .salawat-card,
body.intro-loading .whatsapp-box,
body.intro-loading footer,
body.intro-loading .floating-reward-btn{

visibility:hidden;

}



/* دائرة الدخول بلون مائي */

.intro-circle{

background:

radial-gradient(
circle,
#00D0FF,
#E61C77,
#FF5500
);

box-shadow:

0 0 80px rgba(255,255,255,.8);

}


</style>
     <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="module" src="script.js"></script>

</body>
