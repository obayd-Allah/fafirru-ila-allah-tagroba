  <style>

      /* =========================================================
   INTRO RANDOM SYSTEM
========================================================= */

#introLoader{

    position:fixed;

    inset:0;

    z-index:999999;

    overflow:hidden;

    /*
       سيتم تغييره بواسطة JavaScript
       إلى أحد ألوان الدوائر
    */
    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:Cairo,sans-serif;

    isolation:isolate;
}


/* =========================================================
   الدوائر
========================================================= */

.loader-circle{

    position:absolute;

    border-radius:50%;

    opacity:.97;

    /*
       مهم جدًا:
       لا نستخدم transform في البداية
       من أجل أن يستطيع JavaScript
       التحكم في موضع الدائرة بسهولة.
    */

    will-change:transform;

    /*
       منع أي حدود غريبة
    */

    border:none;

    outline:none;

    /*
       يمنع ظهور الدائرة خارج النظام
    */

    pointer-events:none;

    /*
       الأنيميشن
    */

    animation:

        circleEnter
        var(--enter-duration)
        cubic-bezier(.18,.82,.25,1)
        var(--enter-delay)
        both,

        circleWater
        var(--water-duration)
        ease-in-out
        calc(
            var(--enter-delay)
            +
            var(--enter-duration)
        )
        infinite;

}


/* =========================================================
   دخول الدائرة
========================================================= */

@keyframes circleEnter{

    0%{

        opacity:.95;

        transform:

            translate(
                var(--start-x),
                var(--start-y)
            )

            scale(.72);

    }


    55%{

        opacity:.98;

        transform:

            translate(
                calc(var(--start-x) * -.06),
                calc(var(--start-y) * -.06)
            )

            scale(1.035);

    }


    100%{

        opacity:.97;

        transform:

            translate(0,0)

            scale(1);

    }

}


/* =========================================================
   حركة الماء
========================================================= */

@keyframes circleWater{

    0%,100%{

        transform:

            translate(0,0)

            scale(1);

    }


    25%{

        transform:

            translate(
                var(--move-x1),
                var(--move-y1)
            )

            scale(var(--scale1));

    }


    50%{

        transform:

            translate(
                var(--move-x2),
                var(--move-y2)
            )

            scale(var(--scale2));

    }


    75%{

        transform:

            translate(
                var(--move-x3),
                var(--move-y3)
            )

            scale(var(--scale3));

    }

}


/* =========================================================
   محتوى النص
========================================================= */

.intro-content{

    position:relative;

    z-index:100000;

    text-align:center;

    color:white;

    pointer-events:none;

    padding:20px;

    width:100%;

    box-sizing:border-box;

    text-shadow:
        0 5px 20px rgba(0,0,0,.35);

}


/* =========================================================
   العنوان
========================================================= */

#introTitle{

    font-size:
        clamp(45px,10vw,90px);

    font-weight:900;

    line-height:1.2;

    opacity:0;

    animation:

        dropWater
        1s
        forwards
        .8s,

        softPulse
        2s
        infinite
        2s;

}


/* =========================================================
   العنوان الفرعي
========================================================= */

#introSub{

    font-size:
        clamp(32px,8vw,70px);

    font-weight:900;

    line-height:1.3;

    margin-top:20px;

    opacity:0;

    animation:

        zoomShow
        .8s
        forwards
        1.8s,

        softPulse
        2s
        infinite
        3s;

}


/* =========================================================
   الرسالة
========================================================= */

#introMessage{

    margin-top:35px;

    font-size:
        clamp(20px,4vw,38px);

    font-weight:700;

    line-height:1.7;

    opacity:0;

    animation:

        fadeMessage
        1s
        forwards
        3s;

}


/* =========================================================
   نزول العنوان
========================================================= */

@keyframes dropWater{

    0%{

        opacity:0;

        transform:
            translateY(-150px)
            scale(.7);

    }


    70%{

        transform:
            translateY(15px)
            scale(1.06);

    }


    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   ظهور العنوان الفرعي
========================================================= */

@keyframes zoomShow{

    from{

        opacity:0;

        transform:
            scale(.35);

    }


    to{

        opacity:1;

        transform:
            scale(1);

    }

}


/* =========================================================
   نبضة
========================================================= */

@keyframes softPulse{

    50%{

        transform:
            scale(1.045);

    }

}


/* =========================================================
   ظهور الرسالة
========================================================= */

@keyframes fadeMessage{

    to{

        opacity:1;

    }

}


/* =========================================================
   خروج الـIntro
========================================================= */

.loader-hide{

    animation:

        loaderFade
        1s
        forwards;

}


/*
   عندما يبدأ الخروج:
   كل الدوائر تتقلص وتختفي.
*/

.loader-hide .loader-circle{

    animation:

        circleExit
        .9s
        cubic-bezier(.22,.8,.25,1)
        forwards;

}


/* =========================================================
   خروج الدوائر
========================================================= */

@keyframes circleExit{

    to{

        transform:
            scale(.15);

        opacity:0;

    }

}


/* =========================================================
   خروج النص
========================================================= */

.loader-hide .intro-content{

    animation:

        contentExit
        .8s
        forwards;

}


@keyframes contentExit{

    to{

        opacity:0;

        transform:
            scale(.8);

    }

}


/* =========================================================
   اختفاء الخلفية
========================================================= */

@keyframes loaderFade{

    to{

        background:
            transparent;

    }

}
      
  </style>
