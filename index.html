  <style>

      /* =========================================================
   INTRO RANDOM SYSTEM
========================================================= */

#introLoader{

    position:fixed;

    inset:0;

    z-index:999999;

    overflow:hidden;

    /*
       سيتم تغييره بواسطة JavaScript
       إلى أحد ألوان الدوائر
    */
    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:Cairo,sans-serif;

    isolation:isolate;
}


/* =========================================================
   الدوائر
========================================================= */

.loader-circle{

    position:absolute;

    border-radius:50%;

    opacity:.97;

    /*
       مهم جدًا:
       لا نستخدم transform في البداية
       من أجل أن يستطيع JavaScript
       التحكم في موضع الدائرة بسهولة.
    */

    will-change:transform;

    /*
       منع أي حدود غريبة
    */

    border:none;

    outline:none;

    /*
       يمنع ظهور الدائرة خارج النظام
    */

    pointer-events:none;

    /*
       الأنيميشن
    */

    animation:

        circleEnter
        var(--enter-duration)
        cubic-bezier(.18,.82,.25,1)
        var(--enter-delay)
        both,

        circleWater
        var(--water-duration)
        ease-in-out
        calc(
            var(--enter-delay)
            +
            var(--enter-duration)
        )
        infinite;

}


/* =========================================================
   دخول الدائرة
========================================================= */

@keyframes circleEnter{

    0%{

        opacity:.95;

        transform:

            translate(
                var(--start-x),
                var(--start-y)
            )

            scale(.72);

    }


    55%{

        opacity:.98;

        transform:

            translate(
                calc(var(--start-x) * -.06),
                calc(var(--start-y) * -.06)
            )

            scale(1.035);

    }


    100%{

        opacity:.97;

        transform:

            translate(0,0)

            scale(1);

    }

}


/* =========================================================
   حركة الماء
========================================================= */

@keyframes circleWater{

    0%,100%{

        transform:

            translate(0,0)

            scale(1);

    }


    25%{

        transform:

            translate(
                var(--move-x1),
                var(--move-y1)
            )

            scale(var(--scale1));

    }


    50%{

        transform:

            translate(
                var(--move-x2),
                var(--move-y2)
            )

            scale(var(--scale2));

    }


    75%{

        transform:

            translate(
                var(--move-x3),
                var(--move-y3)
            )

            scale(var(--scale3));

    }

}


/* =========================================================
   محتوى النص
========================================================= */

.intro-content{

    position:relative;

    z-index:100000;

    text-align:center;

    color:white;

    pointer-events:none;

    padding:20px;

    width:100%;

    box-sizing:border-box;

    text-shadow:
        0 5px 20px rgba(0,0,0,.35);

}


/* =========================================================
   العنوان
========================================================= */

#introTitle{

    font-size:
        clamp(45px,10vw,90px);

    font-weight:900;

    line-height:1.2;

    opacity:0;

    animation:

        dropWater
        1s
        forwards
        .8s,

        softPulse
        2s
        infinite
        2s;

}


/* =========================================================
   العنوان الفرعي
========================================================= */

#introSub{

    font-size:
        clamp(32px,8vw,70px);

    font-weight:900;

    line-height:1.3;

    margin-top:20px;

    opacity:0;

    animation:

        zoomShow
        .8s
        forwards
        1.8s,

        softPulse
        2s
        infinite
        3s;

}


/* =========================================================
   الرسالة
========================================================= */

#introMessage{

    margin-top:35px;

    font-size:
        clamp(20px,4vw,38px);

    font-weight:700;

    line-height:1.7;

    opacity:0;

    animation:

        fadeMessage
        1s
        forwards
        3s;

}


/* =========================================================
   نزول العنوان
========================================================= */

@keyframes dropWater{

    0%{

        opacity:0;

        transform:
            translateY(-150px)
            scale(.7);

    }


    70%{

        transform:
            translateY(15px)
            scale(1.06);

    }


    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   ظهور العنوان الفرعي
========================================================= */

@keyframes zoomShow{

    from{

        opacity:0;

        transform:
            scale(.35);

    }


    to{

        opacity:1;

        transform:
            scale(1);

    }

}


/* =========================================================
   نبضة
========================================================= */

@keyframes softPulse{

    50%{

        transform:
            scale(1.045);

    }

}


/* =========================================================
   ظهور الرسالة
========================================================= */

@keyframes fadeMessage{

    to{

        opacity:1;

    }

}


/* =========================================================
   خروج الـIntro
========================================================= */

.loader-hide{

    animation:

        loaderFade
        1s
        forwards;

}


/*
   عندما يبدأ الخروج:
   كل الدوائر تتقلص وتختفي.
*/

.loader-hide .loader-circle{

    animation:

        circleExit
        .9s
        cubic-bezier(.22,.8,.25,1)
        forwards;

}


/* =========================================================
   خروج الدوائر
========================================================= */

@keyframes circleExit{

    to{

        transform:
            scale(.15);

        opacity:0;

    }

}


/* =========================================================
   خروج النص
========================================================= */

.loader-hide .intro-content{

    animation:

        contentExit
        .8s
        forwards;

}


@keyframes contentExit{

    to{

        opacity:0;

        transform:
            scale(.8);

    }

}


/* =========================================================
   اختفاء الخلفية
========================================================= */

@keyframes loaderFade{

    to{

        background:
            transparent;

    }

}

      /* =========================================================
   SECONDARY INTRO - BASE
========================================================= */

.secondary-intro{

    position:fixed;

    inset:0;

    z-index:999998;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    isolation:isolate;

    font-family:Cairo,sans-serif;

}


.secondary-intro[hidden]{

    display:none;

}


/* الخلفية */

.secondary-intro-bg{

    position:absolute;

    inset:0;

    z-index:1;

}


/* المحتوى */

.secondary-intro-content{

    position:relative;

    z-index:5;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;

}


/* الأيقونة */

.secondary-intro-icon{

    font-size:clamp(70px,18vw,150px);

    line-height:1;

    margin-bottom:20px;

}


/* النص */

.secondary-intro-text{

    color:white;

}


/* العنوان */

.secondary-intro-title{

    font-size:clamp(38px,9vw,80px);

    font-weight:900;

    line-height:1.25;

}


/* العنوان الفرعي */

.secondary-intro-subtitle{

    margin-top:12px;

    font-size:clamp(20px,5vw,40px);

    font-weight:800;

}


/* الديكورات */

.secondary-intro-decor{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

}


/* =========================================================
   خروج الانترو
========================================================= */

.secondary-intro-hide{

    animation:
        secondaryIntroExit
        .7s
        ease-in
        forwards;

}


@keyframes secondaryIntroExit{

    to{

        opacity:0;

        transform:scale(1.08);

    }

        }
      /* =========================================================
   FINISH 2 - SECONDARY INTRO
   Celebration Honors
========================================================= */

.secondary-finish2{

    background:
        radial-gradient(
            circle at 50% 35%,
            #fff8d8 0%,
            #f4e5ff 28%,
            #c9b7f5 65%,
            #6b55a8 100%
        );

}


/* هالة ذهبية خلف المحتوى */

.secondary-finish2
.secondary-intro-bg{

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,220,90,.55),
            transparent 18%
        ),

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.8),
            transparent 18%
        ),

        radial-gradient(
            circle at 80% 75%,
            rgba(255,255,255,.45),
            transparent 20%
        );

    animation:
        finish2Glow
        3.5s
        ease-in-out
        infinite;

}


/* الكأس */

.secondary-finish2
.secondary-intro-icon::before{

    content:"🏆";

}


.secondary-finish2
.secondary-intro-icon{

    font-size:
        clamp(90px,22vw,180px);

    filter:
        drop-shadow(
            0 10px 15px
            rgba(100,70,20,.25)
        );

    animation:
        finish2Trophy
        1.8s
        ease-in-out
        infinite;

}


/* النص */

.secondary-finish2
.secondary-intro-text{

    color:#fff;

    text-shadow:

        0 4px 0 rgba(76,55,120,.25),

        0 8px 25px rgba(55,35,100,.35);

}


/* العنوان */

.secondary-finish2
.secondary-intro-title{

    color:#fffdf0;

    animation:
        finish2Title
        .9s
        cubic-bezier(.2,1.4,.4,1)
        forwards;

}


/* العنوان الفرعي */

.secondary-finish2
.secondary-intro-subtitle{

    color:#fff3b0;

    opacity:0;

    animation:
        finish2Subtitle
        .8s
        ease
        .5s
        forwards;

}


/* النجوم واللمعات */

.secondary-finish2
.secondary-intro-decor{

    background-image:

        radial-gradient(
            circle,
            #fff 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle,
            #ffe37a 0 3px,
            transparent 4px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.8) 0 2px,
            transparent 3px
        );

    background-size:

        90px 110px,
        150px 170px,
        220px 190px;

    animation:
        finish2Stars
        5s
        linear
        infinite;

}


/* حركة الهالة */

@keyframes finish2Glow{

    0%,100%{

        transform:scale(1);

        opacity:.75;

    }

    50%{

        transform:scale(1.12);

        opacity:1;

    }

}


/* حركة الكأس */

@keyframes finish2Trophy{

    0%,100%{

        transform:
            translateY(0)
            rotate(-4deg)
            scale(1);

    }

    50%{

        transform:
            translateY(-18px)
            rotate(4deg)
            scale(1.05);

    }

}


/* دخول العنوان */

@keyframes finish2Title{

    from{

        opacity:0;

        transform:
            translateY(50px)
            scale(.55);

    }

    70%{

        transform:
            translateY(-8px)
            scale(1.05);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* دخول العنوان الفرعي */

@keyframes finish2Subtitle{

    from{

        opacity:0;

        transform:
            translateY(25px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* حركة النجوم */

@keyframes finish2Stars{

    from{

        background-position:

            0 0,
            50px 100px,
            100px 20px;

    }

    to{

        background-position:

            90px -110px,
            -100px -70px,
            20px -190px;

    }

    }
      /* =========================================================
   UNDERWATER THEME
========================================================= */

.secondary-underwater{

    background:
        linear-gradient(
            180deg,
            #0077b6,
            #0096c7,
            #00b4d8,
            #023e8a
        );

}


.secondary-underwater
.secondary-intro-bg{

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.28),
            transparent 25%
        ),

            rgba(0,255,255,.18),
            transparent 30%
        );

        underwaterGlow
        4s
        ease-in-out
        infinite;

}


/* الأيقونة */

.secondary-underwater
.secondary-intro-icon{

    animation:
        fishFloat

        ease-in-out

}


/* النص */

.secondary-underwater

        0 0 30px rgba(0,220,255,.8);

}


.secondary-underwater

    animation:
        underwaterTitle
        .8s
        cubic-bezier(.2,.9,.3,1)
        forwards;

}


.secondary-underwater
.secondary-intro-subtitle{

    opacity:0;

    animation:

        underwaterSubtitle
        .8s
        ease
        .4s
        forwards;

}


/* الفقاعات */

.secondary-underwater
.secondary-intro-decor{

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.6) 0 4px,
            transparent 5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.4) 0 6px,
            transparent 7px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.5) 0 3px,
            transparent 4px
        );

    background-size:

        120px 180px,
        180px 250px,
        90px 140px;

    animation:
        bubblesMove
        6s
        linear
        infinite;

}


@keyframes fishFloat{

    0%,100%{

        transform:
            translateY(0)
            rotate(-4deg);

    }

    50%{

        transform:
            translateY(-20px)
            rotate(4deg);

    }

}


@keyframes underwaterGlow{

    0%,100%{

        transform:
            scale(1);

        opacity:.7;

    }

    50%{

        transform:
            scale(1.15);

        opacity:1;

    }

}


@keyframes bubblesMove{

    from{

        background-position:

            0 100vh,
            50px 120vh,
            20px 110vh;

    }

    to{

        background-position:

            0 -200px,
            50px -250px,
            20px -180px;

    }

}


@keyframes underwaterTitle{

    from{

        opacity:0;

        transform:
            translateY(-60px)
            scale(.6);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes underwaterSubtitle{

    from{

        opacity:0;

        transform:
            translateY(30px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}
      /* =========================================================
   SCHOOL 4 THEME
========================================================= */

.secondary-school4{

    background:

        linear-gradient(
            135deg,
            #ffb703,
            #fb8500,
            #ff9f1c
        );

}


.secondary-school4
.secondary-intro-bg{

    background:

        linear-gradient(
            rgba(255,255,255,.12),
            rgba(255,255,255,.04)
        );

}


/* الأيقونة */

.secondary-school4
.secondary-intro-icon::before{

    content:"📚";

}


.secondary-school4
.secondary-intro-icon{

    font-size:clamp(90px,22vw,180px);

    animation:
        schoolBounce
        1.5s
        ease-in-out
        infinite;

}


/* النص */

.secondary-school4
.secondary-intro-text{

    text-shadow:

        0 5px 0 rgba(120,60,0,.2),

        0 10px 25px rgba(0,0,0,.2);

}


/* دخول العنوان */

.secondary-school4
.secondary-intro-title{

    animation:

        schoolTitle
        .8s
        cubic-bezier(.2,1.5,.5,1)
        forwards;

}


/* العنوان الفرعي */

.secondary-school4
.secondary-intro-subtitle{

    opacity:0;

    animation:

        schoolSubtitle
        .7s
        ease
        .45s
        forwards;

}


/* زخارف */

.secondary-school4
.secondary-intro-decor{

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.35) 0 5px,
            transparent 6px
        );

    background-size:
        80px 80px;

    animation:
        schoolDecor
        8s
        linear
        infinite;

}


@keyframes schoolBounce{

    0%,100%{

        transform:
            translateY(0)
            rotate(-5deg);

    }

    50%{

        transform:
            translateY(-18px)
            rotate(5deg);

    }

}


@keyframes schoolTitle{

    from{

        opacity:0;

        transform:

            rotate(-8deg)
            scale(.4);

    }

    to{

        opacity:1;

        transform:

            rotate(0)
            scale(1);

    }

}


@keyframes schoolSubtitle{

    from{

        opacity:0;

        transform:
            translateY(30px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


@keyframes schoolDecor{

    from{

        background-position:
            0 0;

    }

    to{

        background-position:
            80px 80px;

    }

}
  </style>
