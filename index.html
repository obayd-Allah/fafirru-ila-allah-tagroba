@keyframes waterMove{

0%,100%{
transform:translate(0,0) scale(1);
}


25%{
transform:translate(15px,-20px) scale(1.04);
}


50%{
transform:translate(-12px,15px) scale(.98);
}


75%{
transform:translate(10px,10px) scale(1.03);
}

}



.intro-content{

position:relative;
z-index:5;
text-align:center;
color:white;

text-shadow:
0 5px 20px rgba(0,0,0,.3);

}



#introTitle{

font-size:clamp(45px,10vw,90px);

font-weight:900;

opacity:0;

animation:
dropWater 1s forwards .8s,
softPulse 2s infinite 2s;

}



#introSub{

font-size:clamp(35px,8vw,75px);

font-weight:900;

margin-top:20px;

opacity:0;

animation:
zoomShow .8s forwards 1.8s,
softPulse 2s infinite 3s;

}



#introMessage{

margin-top:30px;

font-size:clamp(20px,4vw,38px);

font-weight:700;

opacity:0;

animation:
fadeMessage 1s forwards 3s;

}



@keyframes dropWater{

0%{
opacity:0;
transform:translateY(-120px) scale(.7);
}


70%{
transform:translateY(15px) scale(1.05);
}


100%{
opacity:1;
transform:translateY(0) scale(1);
}

}



@keyframes zoomShow{

from{
opacity:0;
transform:scale(.4);
}

to{
opacity:1;
transform:scale(1);
}

}



@keyframes softPulse{

50%{
transform:scale(1.04);
}

}



@keyframes fadeMessage{

to{
opacity:1;
}

}



.loader-hide .loader-circle{

animation:
circleExit .9s forwards;

}



@keyframes circleExit{

to{

transform:scale(0);

opacity:0;

}

}
