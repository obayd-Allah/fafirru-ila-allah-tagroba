<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>إنشاء أكواد المكافآت</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@700&family=Changa:wght@700&family=Baloo+Bhaijaan+2:wght@700&family=Aref+Ruqaa:wght@700&family=Amiri:wght@700&display=swap"
rel="stylesheet">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:Cairo,sans-serif;

background:#eef5fb;

padding:25px;

}

.box{

max-width:520px;

margin:auto;

background:white;

padding:25px;

border-radius:18px;

box-shadow:0 0 20px rgba(0,0,0,.12);

}

h2{

text-align:center;

color:#1b5e20;

margin-bottom:20px;

}

label{

display:block;

margin-top:15px;

margin-bottom:6px;

font-weight:bold;

color:#444;

}

input,

select{

width:100%;

padding:12px;

font-size:18px;

border-radius:10px;

border:1px solid #ccc;

font-family:Cairo;

}

button{

width:100%;

padding:14px;

margin-top:15px;

font-size:20px;

border:none;

border-radius:10px;

cursor:pointer;

font-family:Cairo;

}

#create{

background:#2e7d32;

color:white;

}

#create:hover{

background:#1b5e20;

}

#deleteAll{

background:#d32f2f;

color:white;

}

#deleteAll:hover{

background:#b71c1c;

}

#templates{

display:flex;

gap:12px;

justify-content:center;

flex-wrap:wrap;

margin-top:15px;

margin-bottom:20px;

}

hr{

border:none;

height:1px;

background:#ddd;

margin:20px 0;

}

#codesTable{

width:100%;

border-collapse:collapse;

background:white;

}

#codesTable th{

background:#1976d2;

color:white;

padding:10px;

}

#codesTable td{

padding:10px;

border-bottom:1px solid #eee;

text-align:center;

}

#codesTable tr:hover{

background:#f8fbff;

}

.statCard{

flex:1;

min-width:130px;

background:#f5f9ff;

border-radius:12px;

padding:15px;

text-align:center;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.statCard .num{

font-size:28px;

font-weight:bold;

color:#1976d2;

}

.statCard .title{

margin-top:6px;

color:#666;

font-size:15px;

}

.editBtn{

background:#2e7d32;

color:white;

border:none;

padding:6px 12px;

border-radius:8px;

cursor:pointer;

}

.deleteBtn{

background:#d32f2f;

color:white;

border:none;

padding:6px 12px;

border-radius:8px;

cursor:pointer;

}

.cardOption{

cursor:pointer;

}

.cardOption input{

display:none;

}

.cardOption img{

width:120px;

border-radius:12px;

border:4px solid transparent;

transition:.25s;

}

.cardOption input:checked+img{

border-color:#2e7d32;

transform:scale(1.05);

}

#status{

margin-top:20px;

text-align:center;

font-size:18px;

font-weight:bold;

color:#1b5e20;

}

#progressBar{

margin-top:20px;

width:100%;

height:24px;

display:none;

}

.smallBtn{

margin-top:10px;

background:#ff9800;

color:#fff;

border:none;

padding:8px 14px;

border-radius:8px;

cursor:pointer;

font-size:14px;

}

</style>

</head>

<body>

<div class="box">

<h2>

إنشاء أكواد الجواهر

</h2>

<label>

عدد الأكواد التي تريد إنشاءها

</label>

<input
id="count"
type="number"
value="42">

<label>

عدد الجواهر

</label>

<input
id="points"
type="number"
value="10">

<label>

اختر تصميم البطاقة

</label>

<div id="templates">

<label class="cardOption">

<input
type="radio"
name="template"
value="10"
checked>

<img src="10.jpg">

</label>

<label class="cardOption">

<input
type="radio"
name="template"
value="20">

<img src="20.jpg">

</label>

<label class="cardOption">

<input
type="radio"
name="template"
value="30">

<img src="30.jpg">

</label>

</div>

<label>

لون الكود

</label>

<input
type="color"
id="textColor"
value="#0065F3"
style="display:none">

<div
style="display:flex;gap:10px;margin-top:10px;justify-content:center;">

<button
type="button"
onclick="document.getElementById('textColor').value='#0065F3'"
style="width:45px;height:45px;background:#0065F3;border-radius:50%;border:2px solid #ccc;">
</button>

<button
type="button"
onclick="document.getElementById('textColor').value='#03759e'"
style="width:45px;height:45px;background:#03759e;border-radius:50%;border:2px solid #ccc;">
</button>

<button
type="button"
onclick="document.getElementById('textColor').value='#a6321e'"
style="width:45px;height:45px;background:#a6321e;border-radius:50%;border:2px solid #ccc;">
</button>

<button
type="button"
onclick="document.getElementById('textColor').value='#000000'"
style="width:45px;height:45px;background:#000000;border-radius:50%;border:2px solid #ccc;">
</button>

<hr>

<br>

<button
type="button"
onclick="document.getElementById('textColor').value='#EA9D0F'"
style="width:45px;height:45px;background:#EA9D0F;border-radius:50%;border:2px solid #ccc;">
</button>

<button
type="button"
onclick="document.getElementById('textColor').value='#DB0F57'"
style="width:45px;height:45px;background:#DB0F57;border-radius:50%;border:2px solid #ccc;">
</button>

<button
type="button"
onclick="document.getElementById('textColor').value='#16BD24'"
style="width:45px;height:45px;background:#16BD24;border-radius:50%;border:2px solid #ccc;">
</button>

<button
type="button"
onclick="document.getElementById('textColor').value='#16B2BD'"
style="width:45px;height:45px;background:#16B2BD;border-radius:50%;border:2px solid #ccc;">
</button>

</div>

<label>

حجم الخط

</label>

<input
type="number"
id="fontSize"
value="440"
min="20"
max="180">

<label>

نوع الخط

</label>

<select
id="fontFamily">

<option value="Cairo">
Cairo
</option>

<!--
<option value="Tajawal">
Tajawal
</option>

<option value="Changa">
Changa
</option>

<option value="Baloo Bhaijaan 2">
Baloo Bhaijaan 2
</option>

<option value="Aref Ruqaa">
Aref Ruqaa
</option>

<option value="Amiri">
Amiri
</option>
-->

</select>

<button
id="create">

إنشاء الأكواد

</button>

<button
id="deleteAll"
style="display:none">

🗑️ حذف جميع الأكواد

</button>

<button
id="deleteLastBatch"
style="background:#ff5722;color:white">

حذف آخر دفعة

</button>

<button
id="addMosqueId"
style="background:#1565c0;color:white;display:none">

إضافة mosqueId لجميع الطلاب

</button>
<button
    id="copyStudentsIds"
    type="button"
>
    📋 نسخ معرفات الطلاب
</button>
<button
id="migrateStudents"
style="display:none">

ترحيل الطلاب إلى MosqueStudents

</button>

<button
id="fixCodes"
class="smallBtn"
style="background:#1565c0;color:white;display:none">

🔧 ربط الأكواد القديمة بالمسجد الحالي

</button>

<div style="display:none">

<button
id="exportUsed"
style="background:#ff9800;color:white">

💾 حفظ الأكواد المستخدمة

</button>

<hr>

<label>

اختر ملفات CSV

</label>

<input
type="file"
id="csvFile"
accept=".csv">

<div
id="csvFilesList"
style="margin-top:10px">
</div>

<button
id="keepCsvOnly"
style="background:#6a1b9a;color:white">

🛡️ الإبقاء على أكواد ملفات CSV فقط

</button>

<hr>

</div>

<h2>

لوحة إدارة الأكواد

</h2>

<label>

بحث

</label>

<input
id="searchCode"
type="text"
placeholder="ابحث بالكود أو اسم الطالب">

<label>

عرض

</label>

<select
id="filterUsed">

<option value="all">
جميع الأكواد
</option>

<option value="false">
غير المستخدمة
</option>

<option value="true">
المستخدمة
</option>

</select>

<button
id="refreshTable"
style="background:#1976d2;color:white">

تحديث الجدول

</button>

<div
style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap">

<div class="statCard">

<div
class="num"
id="totalCodes">
0
</div>

<div class="title">
الإجمالي
</div>

</div>

<div class="statCard">

<div
class="num"
id="usedCodes">
0
</div>

<div class="title">
المستخدمة
</div>

</div>

<div class="statCard">

<div
class="num"
id="unusedCodes">
0
</div>

<div class="title">
غير المستخدمة
</div>

</div>

</div>

<button
id="selectAll"
style="background:#546e7a;color:white">

تحديد الكل

</button>

<div
style="overflow:auto;margin-top:20px">

<table id="codesTable">

<thead>

<tr>

<th>
تحديد
</th>

<th>
الكود
</th>

<th>
الجواهر
</th>

<th>
الطالب
</th>

<th>
الحالة
</th>

<th>
تاريخ الإنشاء
</th>

<th>
تاريخ الاستخدام
</th>

<th>
الإجراءات
</th>

</tr>

</thead>

<tbody>
</tbody>

</table>

</div>

<button
id="deleteSelected"
style="
display:none;
background:#d32f2f;
color:white;
margin-top:15px;
">

🗑 حذف المحدد
(
<span id="selectedCount">
0
</span>
)

</button>

</div>

<div id="status">
</div>

<progress
id="progressBar"
value="0"
max="100">
</progress>

<button
id="downloadCsv"
style="display:none">

تنزيل ملف CSV

</button>

<button
id="downloadZip"
style="display:none">

تنزيل البطاقات ZIP

</button>

<button
id="downloadPdf"
style="display:none">

تنزيل ملف الطباعة PDF

</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module" src="./codes.js"></script>

</body>

</html>
